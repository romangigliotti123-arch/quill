name: Release

# Builds the macOS app and attaches it to a release.
#
# This was three jobs on three runners while quill-desktop existed — its native
# module could not be cross-compiled, so Windows and Linux each had to build on
# their own OS. Those builds are gone and so are those jobs.
#
# Triggered by pushing a tag (`vX.Y.Z`), or by hand from the Actions tab for
# a rebuild without cutting a new version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Scripts/make_cert.sh imports into the runner's own login keychain
      # with `-A` (all apps, no per-use prompt) — correct for a developer's
      # own interactive session, where that already works. It is NOT enough
      # in a CI runner's non-interactive launchd session: without an
      # explicit partition-list grant, `codesign` waits on a keychain-access
      # prompt that can never be answered and the job hangs with no error,
      # confirmed by a real run that sat in the Build step for 10+ minutes
      # when the same build finishes locally in well under a minute. A
      # dedicated keychain, made and unlocked with a password only this job
      # ever knows, sidesteps needing the login keychain's real password —
      # which nothing here has — while still granting codesign explicit,
      # non-interactive access via set-key-partition-list.
      - name: Create a signing identity
        run: |
          set -euo pipefail
          IDENTITY="Quill Self-Signed"
          KEYCHAIN="ci-signing.keychain-db"
          PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          TMP="$(mktemp -d)"
          # printf, not a heredoc: a heredoc's closing delimiter has to sit at
          # column zero, which YAML's own indentation of this block would break.
          printf '%s\n' \
            '[req]' 'distinguished_name = dn' 'x509_extensions = v3' 'prompt = no' \
            '[dn]' 'CN = Quill Self-Signed' \
            '[v3]' 'basicConstraints = critical, CA:false' \
            'keyUsage = critical, digitalSignature' \
            'extendedKeyUsage = critical, codeSigning' > "$TMP/cfg"
          openssl req -x509 -newkey rsa:2048 -keyout "$TMP/k.key" -out "$TMP/k.crt" \
              -days 3650 -nodes -config "$TMP/cfg" >/dev/null 2>&1
          openssl pkcs12 -export -legacy -inkey "$TMP/k.key" -in "$TMP/k.crt" \
              -out "$TMP/k.p12" -passout pass:quill -name "$IDENTITY" >/dev/null 2>&1

          security import "$TMP/k.p12" -k "$KEYCHAIN" -P quill -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN"
          rm -rf "$TMP"

      - name: Build
        run: Scripts/build.sh --release

      - name: Zip the app
        run: |
          cd "$HOME/Library/Application Support/Quill/build"
          ditto -c -k --sequesterRsrc --keepParent Quill.app "$GITHUB_WORKSPACE/Quill-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: quill-macos
          path: Quill-macOS.zip
          if-no-files-found: error

  release:
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # softprops/action-gh-release does not read the annotated tag message
      # on its own — confirmed by the very first real release, where
      # generate_release_notes alone produced only the auto commit list and
      # silently dropped the whole `git tag -a vX.Y.Z -m "..."` summary.
      # body_path is what actually gets it in.
      - name: Extract the tag's message
        run: git tag -l --format='%(contents)' "${{ github.ref_name }}" > tag-body.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: tag-body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
