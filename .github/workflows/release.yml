name: Release

# Builds the macOS app and attaches it to a release.
#
# This was three jobs on three runners while quill-desktop existed — its native
# module could not be cross-compiled, so Windows and Linux each had to build on
# their own OS. Those builds are gone and so are those jobs.
#
# Triggered by pushing a tag (`vX.Y.Z`), or by hand from the Actions tab for
# a rebuild without cutting a new version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # THE certificate, imported from a secret — never generated here.
      #
      # This step used to run `openssl req -x509 -newkey` and mint a throwaway
      # identity per run. It signed fine and the release looked correct, which
      # is why it survived three releases. What it actually did was change the
      # app's identity every time.
      #
      # macOS binds every TCC grant to the Designated Requirement, and for a
      # self-signed app that requirement names the certificate's leaf hash:
      #
      #     identifier "com.romangigliotti.quill" and certificate leaf = H"…"
      #
      # v1.0.1 shipped a862afa8…, v1.0.2 shipped ddb73900…, v1.0.3 shipped
      # 30268b8e… — three different apps as far as tccd is concerned. So every
      # update silently revoked Microphone, Accessibility and Input Monitoring
      # for everyone who took it, leaving the System Settings toggles reading ON
      # while bound to a hash that no longer existed. The README already
      # described the symptom ("a stale Accessibility grant looks like a broken
      # app") without anyone connecting it to the thing that caused it.
      #
      # QUILL_SIGNING_P12 is the same identity Scripts/build.sh uses, so a
      # locally built Quill and a downloaded one are one app to TCC.
      #
      # A dedicated keychain rather than the runner's login one: importing with
      # `-A` is enough for a developer's interactive session but not for a CI
      # runner's non-interactive launchd session, where codesign otherwise waits
      # on a keychain-access prompt that can never be answered and the job hangs
      # with no error — confirmed by a real run that sat in Build for 10+
      # minutes. Making the keychain here means its password is one this job
      # invents, so set-key-partition-list can grant codesign explicit access
      # without needing the login keychain's real password, which nothing has.
      - name: Import the signing identity
        env:
          P12_BASE64: ${{ secrets.QUILL_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.QUILL_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          IDENTITY_SHA="E500962447AD091332F21CA6C28286B30E284C4F"

          # Fail here rather than fall back to a fresh certificate. A release
          # signed with the wrong key costs every existing user all three
          # permissions, and nothing downstream would notice.
          if [ -z "${P12_BASE64:-}" ] || [ -z "${P12_PASSWORD:-}" ]; then
            echo "::error::QUILL_SIGNING_P12 / QUILL_SIGNING_P12_PASSWORD are not set." >&2
            echo "Signing with anything else would revoke every user's Microphone," >&2
            echo "Accessibility and Input Monitoring grants on update. Refusing." >&2
            exit 1
          fi

          KEYCHAIN="ci-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          printf '%s' "$P12_BASE64" | base64 --decode > "$TMP/signing.p12"

          security import "$TMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          if ! security find-identity -p codesigning | grep -q "$IDENTITY_SHA"; then
            echo "::error::The imported key is not $IDENTITY_SHA." >&2
            echo "The secret holds a different certificate; releasing it would drop" >&2
            echo "every user's permissions. Refusing." >&2
            exit 1
          fi
          echo "Signing identity $IDENTITY_SHA ready."

      - name: Build
        run: Scripts/build.sh --release

      # The check that would have caught eight broken releases.
      #
      # `AnalyzerFeed` chose its audio path with `#if compiler(>=6.4)` — decided
      # by whichever machine ran the compiler. This runner's Xcode is newer than
      # the developer's Mac, so every build made here took the macOS 27
      # `AnalyzerInputConverter` branch and every build made there took the
      # hand-rolled one. Same commit, same Mac, one 6.5-second clip: the local
      # build produced 28 partial results and a correct transcript, this one
      # produced zero and an empty string. Dictation was broken in every release
      # ever published and worked perfectly for the only person who built it
      # himself.
      #
      # No unit test could see it — they run on the machine that compiles the
      # other branch. Only running the artefact against audio can.
      - name: Check the built app can actually transcribe
        run: Scripts/check_transcription.sh "$HOME/Library/Application Support/Quill/build/Quill.app"

      # Belt and braces. Scripts/build.sh already refuses to finish on a wrong
      # leaf; this re-checks the artefact that is actually about to be uploaded,
      # because the cost of getting it wrong is paid by every user at once and
      # cannot be undone by a later release.
      - name: Check the shipped app carries the pinned certificate
        run: |
          set -euo pipefail
          APP="$HOME/Library/Application Support/Quill/build/Quill.app"
          EXPECTED="e500962447ad091332f21ca6c28286b30e284c4f"
          DR="$(codesign -d -r- "$APP" 2>&1 | grep -o 'designated => .*' | tr 'A-Z' 'a-z')"
          echo "$DR"
          if ! echo "$DR" | grep -q "$EXPECTED"; then
            echo "::error::Wrong signing certificate — every user's TCC grants would drop." >&2
            exit 1
          fi

      - name: Zip the app
        run: |
          cd "$HOME/Library/Application Support/Quill/build"
          ditto -c -k --sequesterRsrc --keepParent Quill.app "$GITHUB_WORKSPACE/Quill-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: quill-macos
          path: Quill-macOS.zip
          if-no-files-found: error

  release:
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # softprops/action-gh-release does not read the annotated tag message
      # on its own — confirmed by the very first real release, where
      # generate_release_notes alone produced only the auto commit list and
      # silently dropped the whole `git tag -a vX.Y.Z -m "..."` summary.
      # body_path is what actually gets it in.
      - name: Extract the tag's message
        run: git tag -l --format='%(contents)' "${{ github.ref_name }}" > tag-body.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: tag-body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
