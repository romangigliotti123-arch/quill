# Packaging, for three platforms that disagree about almost everything.
#
# Read the comments before changing a line here. Several of these settings look
# redundant and are load-bearing — the ones about asar unpacking in particular,
# where getting it wrong produces an app that launches fine and then fails to
# transcribe with an error that names a file nobody put there.

appId: com.romangigliotti.quill
productName: Quill
copyright: Copyright © 2026 Roman Gigliotti

directories:
  output: release
  buildResources: build

# Only what runs. `src` is TypeScript, `tests` is tests, `scripts` builds the
# thing — none of it belongs in a shipped app, and `dist-tests` in particular
# would drag the whole test corpus along with it.
files:
  - dist/**/*
  - '!dist/build-tools/**'
  - package.json
  - '!**/*.map'
  - '!**/{.eslintrc,.editorconfig,.nvmrc,.github,.vscode}'
  - '!node_modules/**/{test,tests,__tests__,example,examples,docs,doc}/**'
  - '!node_modules/**/*.{md,markdown,ts,map,flow}'
  # # 300 MB of things this app never runs
  #
  # The transcriber lives in a renderer, so it uses the BROWSER build of
  # `@huggingface/transformers`, which inlines its own copy of the inference
  # runtime's JavaScript and fetches only the WebAssembly. That makes three
  # large trees dead weight in the installer:
  #
  #   * `onnxruntime-node` (87 MB) is the native backend for a Node process.
  #     Nothing here is a Node process. It arrives as a dependency of
  #     `transformers`, which picks it only under the `node` export condition.
  #   * `@img` is sharp, an image codec pulled in for vision models. Quill
  #     transcribes audio.
  #   * everything in `onnxruntime-web/dist` except `ort-wasm*` — the `.js`,
  #     `.mjs` and `.map` bundles are the JavaScript already inlined into
  #     `transformers.js`, present again in eleven build variants.
  #
  # Verified by packaging with and without and running a transcription: the
  # remaining four `.wasm` files are what `quill://runtime/` is actually asked
  # for. If a future model needs one of the dropped files, the symptom is a 404
  # on `quill://runtime/<name>` in the speech window's console — not a mystery.
  - '!node_modules/onnxruntime-node/**'
  - '!node_modules/@img/**'
  - '!node_modules/onnxruntime-web/dist/!(ort-wasm*)'

# # Why these four are unpacked
#
# asar is a read-only archive that Node can `require` through — but only for
# JavaScript. Three things here are not JavaScript:
#
#   * `uiohook-napi` is a `.node` binary, and `dlopen` needs a real path on
#     disk. Inside an asar it fails at load, which means no hotkey at all.
#   * `onnxruntime-web` ships `.wasm` files that are fetched, not required, and
#     a fetch cannot see inside an asar.
#   * `@huggingface/transformers` resolves the runtime files above by path at
#     run time, so it has to sit on the same side of the boundary as they do.
asarUnpack:
  - node_modules/uiohook-napi/**
  - node_modules/onnxruntime-web/**
  - node_modules/@huggingface/transformers/**

# The model is NOT bundled. It is ~250 MB per variant, it changes independently
# of the app, and shipping it would triple every installer for a file most users
# would redownload anyway when they switched model. Quill fetches it on first
# use and caches it in the data directory, where the user can see it and delete
# it.

win:
  icon: build/icon.png
  target:
    # nsis for people who expect an installer; portable for the ones who want a
    # single .exe they can carry on a stick and who are much of this app's
    # audience — nothing here needs to be installed to work.
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  # Unsigned. SmartScreen will warn on first run and that warning is honest:
  # there is no certificate. A code-signing certificate costs real money per
  # year and buying one is the user's call, not a default.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false          # per-user, so no UAC prompt to install
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Quill
  # An uninstall that leaves the dictation history behind is a surprise; one
  # that deletes it without asking is worse. The app has an "erase everything"
  # button that says exactly what it does, so the uninstaller does not guess.
  deleteAppDataOnUninstall: false

portable:
  artifactName: Quill-${version}-portable.exe

linux:
  icon: build/icon.png
  category: Utility
  synopsis: Hold a key, speak, and the words land where your caret already is
  description: >
    Quill turns speech into text and puts it into whatever you were already
    typing in. Transcription runs on this machine; nothing is sent anywhere
    unless you turn the optional AI cleanup on yourself.
  target:
    # AppImage first: it is the one format that runs on a distribution nobody
    # anticipated. deb and rpm exist because a package that appears in the
    # system's own list is what most people actually want.
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
  desktop:
    entry:
      # Without this the window manager cannot match the running window to the
      # .desktop file, and the app shows up in the dock as a second, unnamed,
      # generic-icon entry beside its own launcher.
      StartupWMClass: Quill
      Keywords: dictation;speech;voice;transcription;whisper;
      StartupNotify: 'true'

deb:
  # `libayatana-appindicator3` is what Electron's tray talks to on Linux, and
  # without it the tray silently does not appear. It is a Recommends rather than
  # a Depends because the app is usable without a tray — see trayIcon.ts — and a
  # hard dependency would refuse to install on a system that has no tray at all.
  recommends:
    - libayatana-appindicator3-1
    - libnotify4
    # `xprop` lives here, and it is how the X11 window watcher reads which
    # application is in front. Without it Quill still dictates; it just formats
    # everything as prose, because it cannot tell a terminal from a text field.
    - x11-utils

rpm:
  # No dependency list. rpm has no Recommends in electron-builder's schema, and
  # the alternative — `depends` — is a HARD requirement that would refuse to
  # install on a system without a tray. Everything the tray and the window
  # watcher want is optional by design, so the README lists them instead of the
  # package manager enforcing them.
  fpm:
    - --rpm-tag
    - '%define _build_id_links none'

mac:
  # The original app is the native one; this exists so the same build runs on a
  # Mac for development and for anyone who wants the portable version.
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Quill needs the microphone, and needs to watch and post keys. macOS demands
  # both strings or it kills the app instead of asking.
  extendInfo:
    NSMicrophoneUsageDescription: Quill listens while you hold your dictation key, and transcribes on this machine.
    LSUIElement: true
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Unsigned by default. Signing needs a paid Developer ID; notarisation needs
  # an Apple ID and an app-specific password. Both are the user's to supply.
  identity: null

publish: null
